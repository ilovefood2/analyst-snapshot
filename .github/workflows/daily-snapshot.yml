name: Daily analyst snapshot

on:
  schedule:
    # GitHub cron is UTC. These are the EDT and EST representations of 18:30 New York time.
    # Both fire on weekdays; schedule-gate authorizes exactly one lane and rejects market holidays.
    - cron: "30 22 * * 1-5"
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Legacy smoke-only flag; it never bypasses completed-session publication gates"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      symbols:
        description: "Optional comma-separated symbols for a manual smoke run"
        required: false
        default: ""
      run_date:
        description: "Optional completed XNYS session YYYY-MM-DD"
        required: false
        default: ""
      fresh:
        description: "Use an isolated fresh archive; required to replace an invalid/pre-close run"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      price_only:
        description: "Publish the sealed Daily-price generation only; skip analyst and market work"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-analyst-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # GitHub caps a job at 360 minutes. The run step gets a shorter budget of its own so that a
    # timeout still leaves time for the commit step to preserve whatever was fetched.
    timeout-minutes: 355
    env:
      SNAPSHOT_DIR: ./archive
      # universe.txt includes the tracked SwingLab K185 price supplement. The collector also
      # unions the fixed Trend anchors and fails on any canonical-to-Yahoo symbol collision.
      UNIVERSE_FILE: ./universe.txt
      LOG_DIR: ./logs
      SYMBOL_DELAY_SECONDS: "0.5"
      PYTHONUNBUFFERED: "1"
      # Fail the build when any dataset covers less than this share of the universe. The data is
      # committed before this gate runs, so a red build never costs a day of history.
      MIN_COVERAGE: "0.95"
      MIN_PRICE_COVERAGE: "0.95"
      PRICE_BATCH_SIZE: "50"
      # Free official prospective context only. Cboe Open-Close is intentionally excluded because
      # it is a paid proprietary product; OCC provides account-type volume without buy/sell or
      # open/close, CFTC provides weekly trader categories, and FINRA provides short-sale volume.
      MARKET_CONTEXT_SYMBOLS: QQQ,SPY

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Authorize 18:30 America/New_York schedule
        id: schedule_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          python -m analyst_snapshot schedule-gate \
            --event-name "$EVENT_NAME" \
            --event-schedule "$EVENT_SCHEDULE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve latest completed XNYS session
        id: calendar
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          OVERRIDE: ${{ inputs.run_date || '' }}
          EVENT_NAME: ${{ github.event_name }}
          GATED_DATE: ${{ steps.schedule_gate.outputs.new_york_date }}
        run: |
          session_arg=""
          if [ -n "$OVERRIDE" ]; then
            session_arg="--session-date $OVERRIDE"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            session_arg="--session-date $GATED_DATE"
          fi
          python -m analyst_snapshot should-run \
            --github-output "$GITHUB_OUTPUT" $session_arg

      - name: Select isolated or resumable archive
        id: workspace
        if: steps.calendar.outputs.run == 'true'
        env:
          FRESH: ${{ inputs.fresh || 'false' }}
        run: |
          if [ "$FRESH" = "true" ]; then
            snapshot_dir="$RUNNER_TEMP/analyst-recovery/archive"
            mkdir -p "$snapshot_dir"
            if [ -d archive/_index ]; then
              cp -R archive/_index "$snapshot_dir/_index"
            fi
            echo "resume_arg=" >> "$GITHUB_OUTPUT"
          else
            snapshot_dir="./archive"
            echo "resume_arg=--resume" >> "$GITHUB_OUTPUT"
          fi
          echo "fresh=$FRESH" >> "$GITHUB_OUTPUT"
          echo "snapshot_dir=$snapshot_dir" >> "$GITHUB_OUTPUT"

      - name: Reject an invalid or not-yet-closed manual session
        if: inputs.run_date != '' && steps.calendar.outputs.run != 'true'
        run: |
          echo "::error::Requested run_date is not a completed XNYS session."
          exit 1

      - name: Reject price-only symbol scope
        if: inputs.price_only == true && inputs.symbols != ''
        run: |
          echo "::error::price_only requires an empty symbols input."
          exit 1

      # Prices run before the multi-hour analyst loop. The collector uses one network lane
      # (threads=false), immutable batch checkpoints, and a 30-XNYS-session capture window so a
      # retry can resume without parallel Yahoo fan-out. Ordinary symbols require the exact target
      # row; fixed Trend anchors retain the complete-window requirement.
      - name: Capture Daily price recovery tail
        id: capture_daily_prices
        if: steps.calendar.outputs.run == 'true' && !inputs.symbols
        timeout-minutes: 180
        continue-on-error: true
        env:
          RUN_DATE: ${{ steps.calendar.outputs.trading_date }}
          SNAPSHOT_DIR: ${{ steps.workspace.outputs.snapshot_dir }}
          RESUME_ARG: ${{ steps.workspace.outputs.resume_arg }}
        run: |
          python -m analyst_snapshot daily-prices $RESUME_ARG \
            --run-date "$RUN_DATE" \
            --batch-size "$PRICE_BATCH_SIZE"

      - name: Verify Daily price recovery tail
        id: verify_daily_prices
        if: always() && steps.calendar.outputs.run == 'true' && !inputs.symbols
        continue-on-error: true
        env:
          RUN_DATE: ${{ steps.calendar.outputs.trading_date }}
          SNAPSHOT_DIR: ${{ steps.workspace.outputs.snapshot_dir }}
        run: |
          python -m analyst_snapshot verify-daily-prices \
            --run-date "$RUN_DATE" \
            --fail-under "$MIN_PRICE_COVERAGE" \
            --json-out "verify-daily-prices-$RUN_DATE.json"

      - name: Seal independent Daily price recovery
        id: seal_price_recovery
        if: >-
          steps.calendar.outputs.run == 'true' &&
          !inputs.symbols &&
          steps.verify_daily_prices.outcome == 'success'
        env:
          RUN_DATE: ${{ steps.calendar.outputs.trading_date }}
          SNAPSHOT_DIR: ${{ steps.workspace.outputs.snapshot_dir }}
          GENERATION_ID: price_gh_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          python -m analyst_snapshot seal-price-recovery-bundle \
            --run-date "$RUN_DATE" \
            --generation-id "$GENERATION_ID" \
            --min-coverage "$MIN_PRICE_COVERAGE" \
            --repository "$GITHUB_REPOSITORY" \
            --git-ref "$GITHUB_REF" \
            --git-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --json-out "price-recovery-bundle-$RUN_DATE.json"

      - name: Publish independent Daily price recovery to Dropbox
        id: publish_price_recovery
        if: steps.seal_price_recovery.outcome == 'success'
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_REMOTE_ROOT: /DailyStockSnapshots
          RUN_DATE: ${{ steps.calendar.outputs.trading_date }}
          SNAPSHOT_DIR: ${{ steps.workspace.outputs.snapshot_dir }}
        run: python -m analyst_snapshot upload-price-recovery-bundle --run-date "$RUN_DATE"

      # Run this small capture before the multi-hour Yahoo loop so the irreplaceable point-in-time
      # market context survives even when Yahoo consumes the remaining job budget. Any partial
      # capture is committed below and verify-market-context makes the workflow red afterward.
      - name: Capture free prospective market context
        if: >-
          steps.calendar.outputs.run == 'true' &&
          inputs.price_only != true &&
          (steps.publish_price_recovery.outcome == 'success' || inputs.symbols != '')
        timeout-minutes: 10
        continue-on-error: true
        env:
          RUN_DATE: ${{ steps.calendar.outputs.trading_date }}
          SNAPSHOT_DIR: ${{ steps.workspace.outputs.snapshot_dir }}
          RESUME_ARG: ${{ steps.workspace.outputs.resume_arg }}
        run: |
          python -m analyst_snapshot market-context $RESUME_ARG \
            --run-date "$RUN_DATE" \
            --symbols "$MARKET_CONTEXT_SYMBOLS"

      - name: Run analyst snapshot
        if: >-
          steps.calendar.outputs.run == 'true' &&
          inputs.price_only != true &&
          (steps.publish_price_recovery.outcome == 'success' || inputs.symbols != '')
        # Preserve a hard tail for commit, semantic verification, sealing and Dropbox publication
        # inside the 355-minute job cap. A slow analyst run fails visibly instead of consuming the
        # cleanup/publication budget and stranding price checkpoints on the ephemeral runner.
        timeout-minutes: 120
        continue-on-error: true
        env:
          SYMBOLS: ${{ inputs.symbols || '' }}
          RUN_DATE: ${{ steps.calendar.outputs.trading_date }}
          SNAPSHOT_DIR: ${{ steps.workspace.outputs.snapshot_dir }}
          RESUME_ARG: ${{ steps.workspace.outputs.resume_arg }}
        run: |
          if [ -n "$SYMBOLS" ]; then
            python -m analyst_snapshot run $RESUME_ARG --run-date "$RUN_DATE" --symbols "$SYMBOLS"
          else
            python -m analyst_snapshot run $RESUME_ARG --run-date "$RUN_DATE"
          fi

      # Committing before verifying keeps a bad-coverage day in the archive: the point-in-time
      # record of a degraded Yahoo response is itself information, and verify still turns the
      # build red.
      # always(): a run that timed out or failed part-way still fetched real data, and re-running
      # with the same --run-date and --resume picks up exactly where it stopped.
      - name: Commit archive updates
        if: >-
          always() &&
          steps.calendar.outputs.run == 'true' &&
          inputs.price_only != true &&
          (steps.publish_price_recovery.outcome == 'success' || inputs.symbols != '') &&
          steps.workspace.outputs.fresh != 'true'
        env:
          RUN_DATE: ${{ steps.calendar.outputs.trading_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi
          git commit -m "Archive analyst snapshot for $RUN_DATE"
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "push failed (attempt $attempt); rebasing on origin and retrying"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** attempt))
          done
          echo "::error::Could not push the archive after 4 attempts."
          exit 1

      - name: Verify snapshot
        id: verify_analyst
        if: >-
          always() &&
          steps.calendar.outputs.run == 'true' &&
          inputs.price_only != true &&
          (steps.publish_price_recovery.outcome == 'success' || inputs.symbols != '')
        continue-on-error: true
        env:
          RUN_DATE: ${{ steps.calendar.outputs.trading_date }}
          SYMBOLS: ${{ inputs.symbols || '' }}
          SNAPSHOT_DIR: ${{ steps.workspace.outputs.snapshot_dir }}
        run: |
          # A manual run scoped to a handful of symbols is deliberately partial, so holding it to
          # the universe-wide coverage floor would fail every smoke test.
          gate_arg="--fail-under $MIN_COVERAGE"
          if [ -n "$SYMBOLS" ]; then
            gate_arg=""
            echo "Symbol-scoped run; skipping the --fail-under coverage gate."
          fi
          python -m analyst_snapshot verify \
            --run-date "$RUN_DATE" \
            --json-out "verify-$RUN_DATE.json" $gate_arg

      - name: Verify prospective market context
        id: verify_market_context
        if: >-
          always() &&
          steps.calendar.outputs.run == 'true' &&
          inputs.price_only != true &&
          (steps.publish_price_recovery.outcome == 'success' || inputs.symbols != '')
        continue-on-error: true
        env:
          RUN_DATE: ${{ steps.calendar.outputs.trading_date }}
          SNAPSHOT_DIR: ${{ steps.workspace.outputs.snapshot_dir }}
        run: |
          python -m analyst_snapshot verify-market-context \
            --run-date "$RUN_DATE" \
            --json-out "verify-market-context-$RUN_DATE.json"

      - name: Seal completed-session recovery bundle
        id: seal_recovery
        if: >-
          steps.calendar.outputs.run == 'true' &&
          !inputs.symbols &&
          inputs.price_only != true &&
          steps.publish_price_recovery.outcome == 'success' &&
          steps.verify_daily_prices.outcome == 'success' &&
          steps.verify_analyst.outcome == 'success' &&
          steps.verify_market_context.outcome == 'success'
        env:
          RUN_DATE: ${{ steps.calendar.outputs.trading_date }}
          SNAPSHOT_DIR: ${{ steps.workspace.outputs.snapshot_dir }}
          GENERATION_ID: full_gh_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          python -m analyst_snapshot seal-recovery-bundle \
            --run-date "$RUN_DATE" \
            --generation-id "$GENERATION_ID" \
            --min-coverage "$MIN_COVERAGE" \
            --repository "$GITHUB_REPOSITORY" \
            --git-ref "$GITHUB_REF" \
            --git-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --json-out "recovery-bundle-$RUN_DATE.json"

      # Immutable generation files are uploaded first. The small _READY.json authorization pointer
      # is created only after the exact manifest and every inventoried byte have been accepted.
      - name: Publish verified recovery bundle to Dropbox
        id: publish_recovery
        if: steps.seal_recovery.outcome == 'success'
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_REMOTE_ROOT: /DailyStockSnapshots
          RUN_DATE: ${{ steps.calendar.outputs.trading_date }}
          SNAPSHOT_DIR: ${{ steps.workspace.outputs.snapshot_dir }}
        run: python -m analyst_snapshot upload-recovery-bundle --run-date "$RUN_DATE"

      - name: Upload verify report
        if: always() && steps.calendar.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: |
            verify-*.json
            verify-daily-prices-*.json
            price-recovery-bundle-*.json
            recovery-bundle-*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Enforce independent price publication result
        if: always() && steps.calendar.outputs.run == 'true' && !inputs.symbols
        env:
          PRICE_VERIFY: ${{ steps.verify_daily_prices.outcome }}
          PRICE_SEAL: ${{ steps.seal_price_recovery.outcome }}
          PRICE_PUBLISH: ${{ steps.publish_price_recovery.outcome }}
        run: |
          if [ "$PRICE_VERIFY" != "success" ] || [ "$PRICE_SEAL" != "success" ] || \
             [ "$PRICE_PUBLISH" != "success" ]; then
            echo "::error::Price recovery publication failed: verify=$PRICE_VERIFY seal=$PRICE_SEAL publish=$PRICE_PUBLISH"
            exit 1
          fi

      - name: Enforce full recovery publication result
        if: >-
          always() &&
          steps.calendar.outputs.run == 'true' &&
          !inputs.symbols &&
          inputs.price_only != true
        env:
          ANALYST_VERIFY: ${{ steps.verify_analyst.outcome }}
          PRICE_VERIFY: ${{ steps.verify_daily_prices.outcome }}
          MARKET_VERIFY: ${{ steps.verify_market_context.outcome }}
          SEAL: ${{ steps.seal_recovery.outcome }}
          PUBLISH: ${{ steps.publish_recovery.outcome }}
        run: |
          if [ "$PRICE_VERIFY" != "success" ] || [ "$ANALYST_VERIFY" != "success" ] || \
             [ "$MARKET_VERIFY" != "success" ] || \
             [ "$SEAL" != "success" ] || [ "$PUBLISH" != "success" ]; then
            echo "::error::Recovery publication failed: prices=$PRICE_VERIFY analyst=$ANALYST_VERIFY market=$MARKET_VERIFY seal=$SEAL publish=$PUBLISH"
            exit 1
          fi
