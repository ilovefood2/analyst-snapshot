name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "archive/**"
  pull_request:
    paths-ignore:
      - "archive/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Editable install, not `-r requirements-dev.txt`: that installs the dependencies but not
      # the package, so pytest cannot import analyst_snapshot.
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
